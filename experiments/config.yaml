# Kyber-6G experiment matrix — HITL-calibrated for Raspberry Pi 4 Model B
# Updated: Sept 2026 — aligned with live 100-iteration hitl_benchmarks_extended.csv ground truth
# Hardware Specifications:
#   SoC: Broadcom BCM2711 Quad-core ARM Cortex-A72 (ARMv8 64-bit) @ 1.5 GHz
#   RAM: 2 GB LPDDR4-3200 SDRAM
#   Core Allocation:
#     - 2 Dedicated Cores for Cryptographic Handshakes (ThreadPoolExecutor max_workers=2)
#     - 2 Cores reserved for OS Kernel, UDP network stack, and MAVLink avionics telemetry
hardware:
  board: "Raspberry Pi 4 Model B"
  soc: "Broadcom BCM2711"
  cpu_architecture: "Quad-core ARM Cortex-A72 (ARMv8 64-bit)"
  cpu_clock_ghz: 1.5
  ram_gb: 2.0
  total_cores: 4
  crypto_worker_cores: 2
  avionics_os_cores: 2
  crypto_extensions: "ARMv8-A Cryptography Extensions (NEON/AES)"

defaults:
  numRuns: 100
  seed: 42
  simTime: 10.0
  hardwareProfile: rpi4-cortex-a72
  batteryWh: 74.0
  edgeBackhaulMs: 2.0
  parallelHandshake: true
  cacheTtl: 300.0
  speed: 25.0               # Gauss-Markov UAV swarm velocity (m/s)
  band: 5g-3.5ghz           # n78 band for HITL baseline validation
  transportMtu: 1352         # Bytes — forces multi-fragment RLC/MAC segmentation

# ── Empirical HITL Ground Truth Constants (from latest 100-run live Raspberry Pi 4 benchmark) ──
hitl_calibration:
  full_handshake_ms: 45.506           # Cold-start full mutual auth handshake
  warm_handshake_ms: 20.820           # Warm-start full mutual auth handshake
  cached_rekey_1rtt_ms: 8.234          # 1-RTT cached rapid rekey (symmetric-bound, NOT forward-secret)
  aes_gcm_turnaround_ms: 3.904        # AES-256-GCM 512B telemetry roundtrip
  full_handshake_energy_mj: 66.329    # Cold-start full handshake energy
  warm_handshake_energy_mj: 22.046    # Warm-start full handshake energy
  cached_rekey_1rtt_energy_mj: 1.277  # 1-RTT cached rekey energy (HKDF key ratcheting, not PFS)
  aes_gcm_energy_mj: 0.812            # AES-GCM telemetry energy
  cpu_power_w: 4.85                   # Active Cortex-A72 power under dual-core PQC load
  idle_power_w: 1.20                  # Idle SoC power draw
  rf_tx_power_w: 0.52                 # Wi-Fi / 5G RF TX power
  rf_rx_power_w: 0.16                 # Wi-Fi / 5G RF RX power
  soc_temp_c: 49.80                   # Steady-state SoC thermal plateau
  parallel_formula: "T_parallel = max(T_X25519, T_MLKEM) * 1.10"

# ── NIST Level-5 Primitive Sizes & Wire Framing ──
crypto_sizes:
  ml_kem_1024:
    public_key_bytes: 1568
    ciphertext_bytes: 1568
    shared_secret_bytes: 32
  ml_dsa_87:
    public_key_bytes: 2592
    signature_bytes: 4627
  x25519:
    public_key_bytes: 32
  aes_gcm_overhead:
    nonce_bytes: 12
    tag_bytes: 16
    total_overhead_bytes: 28

crypto_modes:
  - ecc
  - kyber
  - kyber_cached
  - hybrid

kyber_levels:
  - 512
  - 768
  - 1024

# ── Swarm Sweep Sizes (HITL-calibrated pipeline) ──
swarm_sizes:
  - 1
  - 10
  - 20
  - 30
  - 40
  - 50
  - 60
  - 70
  - 80

# 5G NR numerology (n78 band, SCS=30 kHz for URLLC)
numerologies:
  - mu: 1
    scs_khz: 30
    tti_us: 500

# Channel parameters for 3.5 GHz n78
channel:
  carrier_freq_ghz: 3.5
  velocity_ms: 25
  base_bler: 0.001

scenarios:
  # ── HITL Validation Scenarios ──
  - hitl-1to1-baseline          # Single UE, mirror RPi4 physical benchmark
  - hitl-swarm-sweep            # Multi-drone parametric sweep
  # ── Original scenarios ──
  - baseline-ecc
  - mlkem1024
  - mlkem1024-cached
  - hybrid-mlkem1024-x25519
  - hybrid-mlkem1024-x25519-cached
  - dense-urban-nlos
  - high-speed-handover
  - quantum-attack

# URLLC threshold
urllc:
  deadline_ms: 10.0

# Smoke subset (fast validation)
smoke:
  numRuns: 3
  crypto_modes: [ecc, hybrid]
  swarm_sizes: [1, 10]
  band: 5g-3.5ghz
